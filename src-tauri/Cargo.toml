[package]
name = "rusty-g6"
version = "1.0.12"
description = "Cross-platform GUI for SoundBlaster X G6 control"
authors = ["Rusty G6 Team"]
license = "AGPL-3.0-only"
repository = "https://github.com/jackbrumley/rusty-g6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_g6_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
dirs = "5.0"
chrono = "0.4"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
tauri-plugin-dialog = "2"

# USB communication libraries
rusb = "0.9"
hidapi = { version = "2.6", features = ["linux-static-hidraw"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Sets the GTK prgname / Wayland app_id (same gtk version Tauri uses).
gtk = "0.18"
# The Linux tray is a StatusNotifierItem published over DBus (pure Rust, no
# libdbus): Tauri's libappindicator tray reports no clicks.
# Use ksni's async-io backend, not "tokio": ksni's tokio feature switches the
# shared zbus crate to tokio, whose blocking API then runs on a current-thread
# runtime that only works inside block_on. tauri-plugin-single-instance serves
# its DBus object with that blocking API, so the running instance never
# answered a second launch and the second launch hung.
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
zbus = "5"

# Linux publishes its tray with ksni instead. tauri-cli reads features from
# every target table regardless of cfg, so Linux bundling still requires the
# libayatana-appindicator3 development package, although the Linux binary
# never loads it.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(unix)'.dependencies]
# setsid() detaches the in-app updater from the app's session.
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
